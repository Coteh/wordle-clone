name: Deploy to Cloudflare Pages

on: [push]

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
    # Checkout the code
    - name: Checkout Code
      uses: actions/checkout@v5

    # Install ImageMagick
    - name: Install Ghostscript
      run: sudo apt-get update && sudo apt-get install -y ghostscript
    # Install ImageMagick 7 from a pinned GitHub release AppImage:
    # versioned and reproducible. Avoid mfinelli/setup-imagemagick, which
    # pulls a rotating "latest" AppImage from imagemagick.org that 404s
    # when the host rotates its binary. Runner has no FUSE, so the
    # AppImage runs self-extracted (APPIMAGE_EXTRACT_AND_RUN).
    - name: Install ImageMagick 7
      env:
        IMAGEMAGICK_VERSION: 7.1.2-30
        IMAGEMAGICK_SHA256: 372af8a3fd61ef5f15c6331cde3e21f840eb165d8b533f34ed05d68736dd682e
      run: |
        curl -fL "https://github.com/ImageMagick/ImageMagick/releases/download/${IMAGEMAGICK_VERSION}/ImageMagick-${IMAGEMAGICK_VERSION}-gcc-x86_64.AppImage" -o magick
        echo "${IMAGEMAGICK_SHA256}  magick" | sha256sum --check
        chmod +x magick
        sudo mv magick /usr/local/bin/magick
        echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
        APPIMAGE_EXTRACT_AND_RUN=1 magick -version

    # Build and process files
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.20.0
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: "pnpm"
    - name: Install dependencies
      run: pnpm install
    - name: Regenerate word list for dev build
      run: ./scripts/gen_word_list.sh
    - name: Build
      run: pnpm run build DEV

    # Deploy to Cloudflare Pages
    - name: Publish to Cloudflare Pages
      uses: cloudflare/wrangler-action@v3
      with:
        command: pages deploy ./build --project-name wordle-clone
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        gitHubToken: ${{ secrets.GITHUB_TOKEN }}
